<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vital Care Referral Forms</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef2f6;min-height:100vh;padding:24px;margin:0;color:#173042}
  .container{max-width:1080px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(16,43,63,.12);overflow:hidden}
  .header{background:#1f6f96;color:#fff;padding:26px 36px}
  .header h1{margin:0;font-size:23px;font-weight:700}
  .header p{margin:5px 0 0;font-size:13px;opacity:.9}
  .build{margin-top:7px;font-size:11px;opacity:.6;font-family:ui-monospace,Menlo,Consolas,monospace}
  .content{padding:26px 36px 36px}
  h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#1f6f96;margin:28px 0 14px;padding-bottom:7px;border-bottom:1px solid #dbe6ee}
  h2:first-child{margin-top:0}
  .types{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
  .tbtn{padding:11px 12px;border:1px solid #cfdce6;border-radius:5px;background:#fff;color:#3c5468;font-weight:600;cursor:pointer;font-size:13px;text-align:center;font-family:inherit}
  .tbtn:hover{border-color:#1f6f96;color:#1f6f96}
  .tbtn.active{background:#1f6f96;color:#fff;border-color:#1f6f96}
  .tbtn small{display:block;font-size:10px;font-weight:500;opacity:.65;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
  .fg{display:flex;flex-direction:column}
  .fg.wide{grid-column:1/-1}
  .fg label{font-weight:600;font-size:12px;margin-bottom:5px;color:#3c5468}
  input[type=text],select,textarea{padding:8px 10px;border:1px solid #cfdce6;border-radius:5px;font-family:inherit;font-size:14px;color:#173042;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1f6f96;box-shadow:0 0 0 3px rgba(31,111,150,.12)}
  .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;border:1px solid #dbe6ee;border-radius:6px;padding:6px}
  .crow{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;font-size:12.5px;border-radius:4px;line-height:1.35}
  .crow:hover{background:#f6fafc}
  .crow input{margin:2px 0 0;flex:none}
  .crow label{cursor:pointer;flex:1}
  .alert{padding:13px 16px;border-radius:5px;margin-bottom:18px;font-size:13.5px;border-left:3px solid;line-height:1.55}
  .alert-info{background:#eef6fb;color:#1f6f96;border-left-color:#1f6f96}
  .alert-success{background:#eaf7ef;color:#1e7a44;border-left-color:#2f9e5f}
  .alert-error{background:#fdeeed;color:#a5342b;border-left-color:#c0392b}
  .alert-warn{background:#fef7e8;color:#8a6216;border-left-color:#d9a327}
  .bar{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap;align-items:center;border-top:1px solid #dbe6ee;padding-top:20px}
  button{padding:10px 24px;border:none;border-radius:5px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-primary{background:#1f6f96;color:#fff}
  .btn-primary:hover:not(:disabled){background:#195b7c}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-secondary{background:#fff;color:#3c5468;border:1px solid #cfdce6}
  .btn-secondary:hover{background:#f4f8fb}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:#3c5468}
  .chk input{flex:none;margin:0}
  .note{font-size:12px;color:#7a8fa0;margin-top:8px;text-align:right}
  .searchwrap{margin-bottom:14px}
  #search{max-width:340px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Vital Care Referral Forms</h1>
    <p>Vital Care of West Chester &middot; print and fax to (513) 780-5881</p>
    <div class="build">build v8 &middot; 2026-08-22 &middot; all 11 forms</div>
  </div>
  <div class="content">
    <div id="messages"></div>

    <h2>Referral Type</h2>
    <div class="types" id="types"></div>

    <div id="formArea" class="hidden">
      <div class="searchwrap" style="margin-top:24px">
        <input type="text" id="search" placeholder="Filter fields…">
      </div>
      <div id="fields"></div>
      <div class="bar">
        <label class="chk" style="margin-right:auto"><input type="checkbox" id="flatten" checked> Flatten before download</label>
        <button type="button" class="btn-secondary" id="clearBtn">Clear form</button>
        <span style="width:14px"></span>
        <button type="button" class="btn-secondary" id="labelBtn">Field-map test PDF</button>
        <button type="button" class="btn-primary" id="go">Download filled PDF</button>
      </div>
      <div class="note">Signature and date are left blank &mdash; the prescriber must sign by hand.</div>
    </div>
  </div>
</div>
<script src="./pdf-lib.min.js"></script>
<script>
(function () {
  'use strict';
  var FORMS = null;
  var current = null;

  // Pharmacy details are the same on every referral — filled automatically.
  var PHARMACY = [
    [/^pharmacy name/i,  'Vital Care of West Chester'],
    [/^address$/i,       '8731 Union Centre Blvd.'],
    [/^city\/state\/zip/i, 'West Chester, OH 45069'],
    [/^phone$/i,         '(513) 780-5880'],
    [/^fax$/i,           '(513) 780-5881']
  ];

  function msg(html, kind) {
    document.getElementById('messages').innerHTML =
      '<div class="alert alert-' + (kind || 'info') + '">' + html + '</div>';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Fields in the header block of the paper form that we prefill and hide.
  function pharmacyValue(field, index) {
    // only the very first few fields on page 1 are the pharmacy header
    if (field.p !== 1 || index > 8) return null;
    for (var i = 0; i < PHARMACY.length; i++) {
      if (PHARMACY[i][0].test(field.l)) return PHARMACY[i][1];
    }
    return null;
  }

  function buildTypes() {
    var wrap = document.getElementById('types');
    Object.keys(FORMS).forEach(function (code) {
      var f = FORMS[code];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tbtn';
      b.innerHTML = esc(f.title) + '<small>' + f.fields.length + ' fields</small>';
      b.onclick = function () {
        var all = document.querySelectorAll('.tbtn');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
        b.classList.add('active');
        selectForm(code);
      };
      wrap.appendChild(b);
    });
  }

  function selectForm(code) {
    current = FORMS[code];
    var host = document.getElementById('fields');
    host.innerHTML = '';

    var groups = [], byName = {};
    current.fields.forEach(function (f, i) {
      f._i = i;
      if (pharmacyValue(f, i) !== null) return;   // auto-filled, don't show
      if (!byName[f.s]) { byName[f.s] = []; groups.push(f.s); }
      byName[f.s].push(f);
    });

    groups.forEach(function (g) {
      var h = document.createElement('h2');
      h.textContent = g;
      host.appendChild(h);

      var list = byName[g];
      var texts = list.filter(function (f) { return f.k !== 'check'; });
      var checks = list.filter(function (f) { return f.k === 'check'; });

      if (texts.length) {
        var grid = document.createElement('div');
        grid.className = 'grid';
        texts.forEach(function (f) {
          var d = document.createElement('div');
          d.className = 'fg' + (f.l.length > 42 ? ' wide' : '');
          var id = 'fld_' + f._i;
          if (f.k === 'radio' && f.o) {
            var opts = f.o.map(function (o) {
              return '<option value="' + esc(o) + '">' + esc(o.replace(/^\//,'')) + '</option>';
            }).join('');
            d.innerHTML = '<label for="' + id + '">' + esc(f.l) + '</label>' +
                          '<select id="' + id + '" data-i="' + f._i + '"><option value="">—</option>' + opts + '</select>';
          } else {
            d.innerHTML = '<label for="' + id + '">' + esc(f.l) + '</label>' +
                          '<input type="text" id="' + id + '" data-i="' + f._i + '">';
          }
          grid.appendChild(d);
        });
        host.appendChild(grid);
      }

      if (checks.length) {
        var box = document.createElement('div');
        box.className = 'checks';
        checks.forEach(function (f) {
          var id = 'fld_' + f._i;
          var r = document.createElement('div');
          r.className = 'crow';
          r.innerHTML = '<input type="checkbox" id="' + id + '" data-i="' + f._i + '">' +
                        '<label for="' + id + '">' + esc(f.l) + '</label>';
          box.appendChild(r);
        });
        host.appendChild(box);
      }
    });

    document.getElementById('formArea').classList.remove('hidden');
    document.getElementById('search').value = '';
    applyFilter();
    msg('<strong>' + esc(current.title) + '</strong> loaded — ' + current.fields.length +
        ' fields. Fill in what you need; anything left blank stays blank on the PDF.', 'info');
  }

  function applyFilter() {
    var q = document.getElementById('search').value.toLowerCase().trim();
    var host = document.getElementById('fields');
    var kids = host.children, visibleInGroup = 0, lastHeader = null;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.tagName === 'H2') {
        if (lastHeader) lastHeader.classList.toggle('hidden', visibleInGroup === 0);
        lastHeader = el; visibleInGroup = 0;
        continue;
      }
      var rows = el.querySelectorAll('.fg, .crow'), shown = 0;
      for (var j = 0; j < rows.length; j++) {
        var txt = rows[j].textContent.toLowerCase();
        var hit = !q || txt.indexOf(q) !== -1;
        rows[j].classList.toggle('hidden', !hit);
        if (hit) shown++;
      }
      el.classList.toggle('hidden', shown === 0);
      visibleInGroup += shown;
    }
    if (lastHeader) lastHeader.classList.toggle('hidden', visibleInGroup === 0);
  }

  function loadPdf() {
    var url = './pdfs/' + current.file;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('Could not load ' + url + ' (HTTP ' + r.status + ')');
      return r.arrayBuffer();
    }).then(function (b) { return PDFLib.PDFDocument.load(b); });
  }

  function download(bytes, name) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function go() {
    if (!current) { msg('Pick a referral type first.', 'error'); return; }
    var btn = document.getElementById('go');
    btn.disabled = true;
    msg('Generating PDF\u2026', 'info');

    var filled = 0, problems = [], patient = '';

    loadPdf().then(function (doc) {
      var form = doc.getForm();
      var index = {};
      form.getFields().forEach(function (o) { index[o.getName()] = o; });

      current.fields.forEach(function (f, i) {
        var auto = pharmacyValue(f, i);
        var el = document.getElementById('fld_' + i);
        var val = auto !== null ? auto : null;

        var obj = index[f.n];
        try {
          if (!obj) throw new Error('not present in PDF');
          if (f.k === 'check') {
            if (el && el.checked) { obj.check(); filled++; }
          } else if (f.k === 'radio') {
            var v = el ? el.value : '';
            if (v) { obj.select(v); filled++; }
          } else {
            var t = val !== null ? val : (el ? el.value : '');
            if (t) {
              obj.setText(String(t));
              filled++;
              if (/last name/i.test(f.l)) patient = String(t);
            }
          }
        } catch (e) {
          problems.push(f.l + ' [' + f.n + ']');
        }
      });

      if (document.getElementById('flatten').checked) {
        try { form.flatten(); } catch (e) { console.warn('flatten failed', e); }
      }
      return doc.save();
    }).then(function (bytes) {
      download(bytes, current.code + '_referral_' + (patient || 'patient') + '.pdf');
      var html = '<strong>Downloaded.</strong> Print and fax to (513) 780-5881. Filled ' +
                 filled + ' field' + (filled === 1 ? '' : 's') + '.';
      if (problems.length) html += '<br><strong>Could not write:</strong> ' + esc(problems.join(', '));
      msg(html, problems.length ? 'warn' : 'success');
      btn.disabled = false;
    }).catch(function (err) {
      console.error(err);
      msg('Error: ' + esc(err.message), 'error');
      btn.disabled = false;
    });
  }

  function labelPdf() {
    if (!current) { msg('Pick a referral type first.', 'error'); return; }
    msg('Building field-map test PDF\u2026', 'info');
    loadPdf().then(function (doc) {
      var form = doc.getForm();
      form.getFields().forEach(function (f) {
        try {
          if (typeof f.setText === 'function') {
            var m = f.getName().match(/(\d+)\s*$/);
            f.setText(m ? m[1] : f.getName().slice(0, 3));
            try { f.setFontSize(7); } catch (e) {}
          } else if (typeof f.check === 'function') { f.check(); }
        } catch (e) {}
      });
      try { form.flatten(); } catch (e) {}
      return doc.save();
    }).then(function (b) {
      download(b, 'FIELDMAP_' + current.code + '.pdf');
      msg('Field-map test PDF downloaded.', 'success');
    }).catch(function (e) { msg('Error: ' + esc(e.message), 'error'); });
  }

  function clearForm() {
    var els = document.querySelectorAll('#fields input, #fields select');
    for (var i = 0; i < els.length; i++) {
      if (els[i].type === 'checkbox') els[i].checked = false; else els[i].value = '';
    }
    msg('Form cleared.', 'info');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onerror = function (m, src, line) {
    msg('Script error: ' + esc(m) + ' (line ' + line + ')', 'error');
  };

  function diagnoseMissingLib() {
    msg('Checking why pdf-lib.min.js did not load\u2026', 'error');
    fetch('./pdf-lib.min.js').then(function (r) {
      return r.text().then(function (body) {
        var where = new URL('./pdf-lib.min.js', window.location.href).href;
        if (!r.ok) {
          msg('<strong>pdf-lib.min.js is missing.</strong> The server returned HTTP ' + r.status +
              ' for:<br><code>' + esc(where) + '</code><br>Upload pdf-lib.min.js into the same folder as index.html.', 'error');
        } else if (/^\s*</.test(body)) {
          msg('<strong>pdf-lib.min.js returned a web page, not JavaScript.</strong> That URL is being ' +
              'redirected or served as HTML:<br><code>' + esc(where) + '</code>', 'error');
        } else {
          msg('<strong>pdf-lib.min.js downloaded (' + Math.round(body.length/1024) + ' KB) but did not run.</strong> ' +
              'Something is blocking scripts on this page \u2014 try an incognito window with extensions disabled.', 'error');
        }
      });
    }).catch(function (e) {
      msg('<strong>pdf-lib.min.js could not be fetched:</strong> ' + esc(e.message), 'error');
    });
  }

  if (typeof PDFLib === 'undefined') {
    diagnoseMissingLib();
  } else {
    document.getElementById('go').addEventListener('click', go);
    document.getElementById('labelBtn').addEventListener('click', labelPdf);
    document.getElementById('clearBtn').addEventListener('click', clearForm);
    document.getElementById('search').addEventListener('input', applyFilter);

    fetch('./forms.json').then(function (r) {
      if (!r.ok) throw new Error('forms.json missing (HTTP ' + r.status + ')');
      return r.json();
    }).then(function (d) {
      FORMS = d;
      buildTypes();
      msg('Pick a referral type to begin.', 'info');
    }).catch(function (e) {
      msg('Could not load forms.json — it must sit in the same folder as index.html. (' + esc(e.message) + ')', 'error');
    });
  }
})();
</script>
</body>
</html>
